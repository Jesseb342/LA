
name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      content:
        description: "Choose which game content to include"
        required: true
        type: choice
        default: "Base game + update + DLC"
        options:
          - "Base game only"
          - "Base game + update (no DLC)"
          - "Base game + DLC (no update)"
          - "Base game + update + DLC"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # ================================================
      # CHECKOUT
      # ================================================

      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      # ================================================
      # DIAGNOSTIC PATCH: LOG SDK FATAL BREAK REGISTERS
      # ================================================

      - name: Add SDK Break diagnostic logging
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("dm/host/hle_svc.c")
          source = path.read_text()
          anchor = "        dm_backtrace(regs[29]);"
          diagnostic = """        LOG("[break-diag] x0(reason)=%#llx x1(ptr)=%#llx x2(size)=%#llx", regs[0], regs[1], regs[2]);
                  LOG("[break-diag] caller args x3-x8=%#llx %#llx %#llx %#llx %#llx %#llx", regs[3], regs[4], regs[5], regs[6], regs[7], regs[8]);
                  LOG("[break-diag] lr=%#llx fp=%#llx saved-reg-slot31=%#llx", regs[30], regs[29], regs[31]);
                  LOG("[break-diag] callee-saved x19-x24=%#llx %#llx %#llx %#llx %#llx %#llx", regs[19], regs[20], regs[21], regs[22], regs[23], regs[24]);
                  LOG("[break-diag] callee-saved x25-x28=%#llx %#llx %#llx %#llx", regs[25], regs[26], regs[27], regs[28]);
                  if (regs[29] >= 0x1000) {
                      uint64_t frame_words[32];
                      memcpy(frame_words, (const void *)(uintptr_t)(regs[29] - 0x80), sizeof frame_words);
                      LOG("[break-diag] stack fp-0x80: %#llx %#llx %#llx %#llx %#llx", frame_words[0], frame_words[1], frame_words[2], frame_words[3], frame_words[4]);
                      LOG("[break-diag] stack fp-0x58: %#llx %#llx %#llx %#llx %#llx", frame_words[5], frame_words[6], frame_words[7], frame_words[8], frame_words[9]);
                      LOG("[break-diag] stack fp-0x30: %#llx %#llx %#llx %#llx %#llx", frame_words[10], frame_words[11], frame_words[12], frame_words[13], frame_words[14]);
                      LOG("[break-diag] stack fp-0x08: %#llx %#llx %#llx %#llx %#llx", frame_words[15], frame_words[16], frame_words[17], frame_words[18], frame_words[19]);
                      LOG("[break-diag] stack fp+0x18: %#llx %#llx %#llx %#llx", frame_words[20], frame_words[21], frame_words[22], frame_words[23]);
                      LOG("[break-diag] stack fp+0x38: %#llx %#llx %#llx %#llx", frame_words[24], frame_words[25], frame_words[26], frame_words[27]);
                      LOG("[break-diag] stack fp+0x58: %#llx %#llx %#llx %#llx", frame_words[28], frame_words[29], frame_words[30], frame_words[31]);
                  }
                  // Search saved guest registers and nearby stack words for pointers
                  // to printable strings in loaded modules (possible SDK assertions).
                  if (regs[29] >= 0x1000) {
                      uint64_t scan_words[32];
                      memcpy(scan_words, (const void *)(uintptr_t)(regs[29] - 0x80), sizeof scan_words);
                      for (unsigned ci = 0; ci < 63; ci++) {
                          uint64_t candidate = ci < 31 ? regs[ci] : scan_words[ci - 31];
                          module_t *sm = module_of((const void *)(uintptr_t)candidate);
                          if (!sm || candidate < (uint64_t)(uintptr_t)sm->base ||
                              candidate >= (uint64_t)(uintptr_t)sm->base + sm->size) continue;
                          const unsigned char *sp = (const unsigned char *)(uintptr_t)candidate;
                          char preview[97]; unsigned si = 0;
                          while (si < sizeof(preview) - 1 &&
                                 candidate + si < (uint64_t)(uintptr_t)sm->base + sm->size &&
                                 sp[si] >= 0x20 && sp[si] <= 0x7e) {
                              preview[si] = (char)sp[si]; si++;
                          }
                          if (si >= 8) {
                              preview[si] = 0;
                              LOG("[break-diag] possible assertion string from %s: %s", sm->name, preview);
                          }
                      }
                  }
                  if (mm && mm->symtab && mm->strtab) {
                      uint64_t lr_off = (uint64_t)((uint8_t *)regs[30] - mm->base);
                      const Elf64_Sym *lr_sym = NULL, *svc_sym = NULL;
                      for (unsigned si = 1; si < mm->nsym; si++) {
                          const Elf64_Sym *sym = &mm->symtab[si];
                          if (!sym->st_shndx) continue;
                          if (sym->st_value <= lr_off && (!lr_sym || sym->st_value > lr_sym->st_value)) lr_sym = sym;
                          if (sym->st_value <= orig_addr && (!svc_sym || sym->st_value > svc_sym->st_value)) svc_sym = sym;
                      }
                      if (lr_sym) LOG("[break-diag] LR symbol=%s+%#llx (offset %#llx)", mm->strtab + lr_sym->st_name, lr_off - lr_sym->st_value, lr_off);
                      if (svc_sym) LOG("[break-diag] SVC symbol=%s+%#llx (offset %#llx)", mm->strtab + svc_sym->st_name, orig_addr - svc_sym->st_value, orig_addr);
                  }
          """

          if source.count(anchor) != 1:
              raise SystemExit(
                  "Expected exactly one Break backtrace anchor; "
                  f"found {source.count(anchor)}. Refusing to patch."
              )

          if "[break-diag]" in source:
              raise SystemExit("Break diagnostics already appear to be patched.")

          path.write_text(source.replace(anchor, diagnostic + anchor, 1))
          print("Added Break argument and guest register diagnostics.")
          PY

      - name: Symbolize SDK startup backtrace
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("dm/host/crash.c")
          source = path.read_text()
          old = '    if (m) fprintf(stderr, " %s%s%s+%#llx", tag, *tag ? "=" : "", m->name, a - (uint64_t)m->base);'
          new = """    if (m) {
              uint64_t offset = a - (uint64_t)m->base;
              const Elf64_Sym *best = NULL;
              if (m->symtab && m->strtab) {
                  for (unsigned si = 1; si < m->nsym; si++) {
                      const Elf64_Sym *sym = &m->symtab[si];
                      if (sym->st_shndx && sym->st_value <= offset &&
                          (!best || sym->st_value > best->st_value)) best = sym;
                  }
              }
              if (best) fprintf(stderr, " %s%s%s=%s+%#llx [module offset %#llx]", tag, *tag ? "=" : "",
                                m->name, m->strtab + best->st_name, offset - best->st_value, offset);
              else fprintf(stderr, " %s%s%s+%#llx [module offset %#llx]", tag, *tag ? "=" : "", m->name, offset, offset);
          }"""
          if source.count(old) != 1:
              raise SystemExit("Expected crash.c module-address formatter exactly once; refusing to patch.")
          path.write_text(source.replace(old, new, 1))
          print("Added symbol names to guest backtrace frames.")
          PY

      - name: Add targeted SDK allocator-entry observation
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          # Reserve observation ID 22 for the SDK allocator entry callback.
          path = Path("dm/host/dm.h")
          source = path.read_text()
          old = "       OBS_UE_MALLOC = 21,                                       // DRAGON QUEST VII Reimagined 1.2.0: Unreal's allocator object just made (hle_uemalloc.c)\n       OBS_MAX = 22 };"
          new = "       OBS_UE_MALLOC = 21,                                       // DRAGON QUEST VII Reimagined 1.2.0: Unreal's allocator object just made (hle_uemalloc.c)\n       OBS_SDK_ALLOC_INIT = 22,                                  // Goose Game: capture StandardAllocator::Initialize arguments\n       OBS_SDK_ALLOC_CALL = 23,                                   // Goose Game: capture arguments immediately before allocator call\n       OBS_MAX = 24 };"
          if source.count(old) != 1:
              raise SystemExit("Expected observation enum block exactly once; refusing to patch dm.h.")
          path.write_text(source.replace(old, new, 1))

          # Register a read-only callback before guest startup begins.
          path = Path("dm/host/main.c")
          source = path.read_text()
          fn_anchor = "static void guest_main(void) {"
          callback = """static void sdk_allocator_init_observe(const uint64_t *regs) {
              LOG("[allocator-entry] this=%#llx memory=%#llx size=%#llx bool=%#llx",
                  regs[0], regs[1], regs[2], regs[3]);
              LOG("[allocator-entry] x4-x8=%#llx %#llx %#llx %#llx %#llx",
                  regs[4], regs[5], regs[6], regs[7], regs[8]);
          }

          static void sdk_allocator_call_observe(const uint64_t *regs) {
              LOG("[allocator-call] x0-x3=%#llx %#llx %#llx %#llx",
                  regs[0], regs[1], regs[2], regs[3]);
              LOG("[allocator-call] x4-x8=%#llx %#llx %#llx %#llx %#llx",
                  regs[4], regs[5], regs[6], regs[7], regs[8]);
          }

          """
          if source.count(fn_anchor) != 1:
              raise SystemExit("Expected guest_main definition exactly once; refusing to patch main.c.")
          source = source.replace(fn_anchor, callback + fn_anchor, 1)
          load_anchor = "    load_modules(argv[1], names, n);"
          load_new = load_anchor + "\n    gate_obs_set(OBS_SDK_ALLOC_INIT, sdk_allocator_init_observe);\n    gate_obs_set(OBS_SDK_ALLOC_CALL, sdk_allocator_call_observe);"
          if source.count(load_anchor) != 1:
              raise SystemExit("Expected load_modules call exactly once; refusing to patch main.c.")
          path.write_text(source.replace(load_anchor, load_new, 1))

          # Add a build-checked entry observation and a post-instruction caller
          # observation. The backtrace return address is main+0x17ffc60, so the
          # BL is at +0x17ffc5c. Observe the preceding instruction AFTER it runs.
          path = Path("dm/tools/patch_nso.py")
          source = path.read_text()
          old = "obs = list(OBS.get(BUILD_ID, []))"
          new = """obs = list(OBS.get(BUILD_ID, []))
          obs_after = []
          if NAME == "sdk":
              allocator_entry = 0x2e7600
              if allocator_entry not in starts:
                  raise SystemExit(f"SDK allocator entry {allocator_entry:#x} is not a recognized function start")
              original = struct.unpack_from('<I', IMG, allocator_entry)[0]
              obs.append((allocator_entry, 22, f'{original:08x}',
                          "Goose Game: capture StandardAllocator::Initialize arguments at function entry"))
          if NAME == "main":
              allocator_call = 0x17ffc5c
              call_ins = dis(struct.unpack_from('<I', IMG, allocator_call)[0], allocator_call)
              if call_ins.mnemonic != "bl":
                  raise SystemExit(f"Expected allocator call BL at main+{allocator_call:#x}, found {call_ins.mnemonic} {call_ins.op_str}")
              observe_off = allocator_call - 4
              original = struct.unpack_from('<I', IMG, observe_off)[0]
              obs_after.append((observe_off, 23, f'{original:08x}',
                                "Goose Game: capture allocator arguments after final caller instruction and before BL"))
              print(f"[allocator-callsite] BL main+{allocator_call:#x}: {call_ins.op_str}")
              for a in range(max(0, allocator_call - 0x40), allocator_call + 4, 4):
                  ins = dis(struct.unpack_from('<I', IMG, a)[0], a)
                  print(f"[allocator-callsite] main+{a:#x}: {ins.mnemonic} {ins.op_str}")"""
          if source.count(old) != 1:
              raise SystemExit("Expected observation-table insertion point exactly once; refusing to patch patch_nso.py.")
          path.write_text(source.replace(old, new, 1))

          # This gate executes a safe instruction first, then captures the
          # resulting registers before the following BL.
          path = Path("dm/tools/patch_nso.py")
          source = path.read_text()
          marker = "# ---- Exclusive windows ----"
          after_fn = """def site_obs_after(off, oid, word):
              ins = dis(word, off)
              assert ins.mnemonic not in ('adr', 'adrp', 'b', 'bl', 'br', 'blr', 'ret', 'cbz', 'cbnz', 'tbz', 'tbnz') and not ins.mnemonic.startswith('b.') \\
                  and not (ins.mnemonic.startswith('ldr') and '[' not in ins.op_str) and not has18(ins), \\
                  f'post-instruction observation cannot relocate {off:#x} {ins.mnemonic} {ins.op_str}'
              start = here()
              emit(word)
              emit(STP_PRE(29, 30, 31, -16))
              emit_gate_call()
              emit(BLR(30))
              ret = here()
              emit(LDP_POST(29, 30, 31, 16))
              emit(B(here(), off + 4))
              gates.append((ret, 'obs', oid, off))
              return start

          """
          if source.count(marker) != 1:
              raise SystemExit("Expected exclusive-window insertion point exactly once; refusing to patch patch_nso.py.")
          source = source.replace(marker, after_fn + marker, 1)

          marker = "# ---- Frame step in whole vsyncs"
          process_after = """for off, oid, ow, why in obs_after:
              w = struct.unpack_from('<I', IMG, off)[0]
              assert f'{w:08x}' == ow, f'post-observation original instruction mismatch {off:#x}: {w:08x}'
              ins = dis(w, off)
              assert ins.mnemonic not in ('adr', 'adrp', 'b', 'bl', 'br', 'blr', 'ret', 'cbz', 'cbnz', 'tbz', 'tbnz') and not ins.mnemonic.startswith('b.') \\
                  and not (ins.mnemonic.startswith('ldr') and '[' not in ins.op_str) and not has18(ins), \\
                  f'post-observation instruction cannot be relocated {off:#x} {ins.mnemonic} {ins.op_str}'
              assert scratch_dead(off + 4), f'post-observation x9-x17 are live before next call at {off:#x}'
              assert off < TEXT_END and off not in kinds and not any(lo <= off < hi for wseg in windows for lo, hi in [(wseg[0].address, wseg[-1].address + 4)]), f'post-observation conflicts with a rewrite site {off:#x}'
              put_branch(off, site_obs_after(off, oid, w))
              stat('obs')

          """
          if source.count(marker) != 1:
              raise SystemExit("Expected frame-step insertion point exactly once; refusing to patch patch_nso.py.")
          source = source.replace(marker, process_after + marker, 1)
          path.write_text(source)
          print("Installed guarded allocator caller observation at main+0x17ffc58.")
          PY

      # ================================================
      # ENVIRONMENT
      # ================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install xcodegen zstd spirv-cross unar

          python -m pip install --upgrade pip

          python -m pip install \
            lz4 capstone fonttools backports.zstd

      # ================================================
      # DOWNLOAD CACHE KEY
      # ================================================

      - name: Prepare download cache
        id: cache-key
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import os

          urls = [
              os.environ.get("GAME_URL", "").strip(),
              os.environ.get("UPDATE_URL", "").strip(),
              os.environ.get("DLC_URL", "").strip(),
          ]

          if not urls[0]:
              raise SystemExit("Game_URL secret is empty.")

          cache_key = hashlib.sha256(
              "|".join(urls).encode()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"key=nxnative-downloads-{cache_key}\n")

          print("Download cache key prepared.")
          PY

          mkdir -p "$RUNNER_TEMP/nxnative/download-cache"

      - name: Restore downloaded game files
        id: download-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nxnative/download-cache
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.key }}

      # ================================================
      # DOWNLOAD GAME / UPDATE / DLC
      # DECODE BASE64 KEYS
      # ================================================

      - name: Download game files and decode keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_BASE64: ${{ secrets.Keys_URL }}
          CONTENT_SELECTION: ${{ inputs.content }}
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nxnative"
          CACHE="$WORK/download-cache"

          mkdir -p "$WORK" "$CACHE"

          download_file() {
            local url="$1"
            local output="$2"
            local filename
            local cached
            local temporary

            filename="$(basename "$output")"
            cached="$CACHE/$filename"
            temporary="$output.part"

            if [[ -z "${url:-}" ]]; then
              echo "::error::Download URL is empty."
              exit 1
            fi

            # Reuse cached downloads.
            if [[ -s "$cached" ]]; then
              echo "========================================"
              echo "CACHE HIT: $filename"
              echo "Reusing cached download."
              echo "========================================"

              cp "$cached" "$output"
              file "$output"
              return
            fi

            echo "========================================"
            echo "CACHE MISS: $filename"
            echo "Starting direct download..."
            echo "========================================"

            # Direct HTTP/HTTPS download with percentage progress.
            curl \
              --fail \
              --location \
              --show-error \
              --progress-bar \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --output "$temporary" \
              "$url"

            if [[ ! -s "$temporary" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            mv "$temporary" "$output"

            echo "Download completed:"
            ls -lh "$output"
            file "$output"

            # Cache successful downloads.
            cp "$output" "$cached"

            echo "Saved $filename to download cache."
          }

          # Base game is required.
          download_file "$GAME_URL" "$WORK/game.download"

          # Include only the content selected at workflow dispatch.
          # The cache key still uses all three URLs, so existing cached
          # game/update/DLC downloads remain available across these choices.
          case "${CONTENT_SELECTION:-}" in
            "Base game only")
              INCLUDE_UPDATE=false
              INCLUDE_DLC=false
              ;;
            "Base game + update (no DLC)")
              INCLUDE_UPDATE=true
              INCLUDE_DLC=false
              ;;
            "Base game + DLC (no update)")
              INCLUDE_UPDATE=false
              INCLUDE_DLC=true
              ;;
            "Base game + update + DLC")
              INCLUDE_UPDATE=true
              INCLUDE_DLC=true
              ;;
            *)
              echo "::error::Unknown content selection: ${CONTENT_SELECTION:-unset}"
              exit 1
              ;;
          esac

          if [[ "$INCLUDE_UPDATE" == true ]]; then
            if [[ -z "${UPDATE_URL:-}" ]]; then
              echo "::error::Update was selected, but UPDATE_URL is not configured."
              exit 1
            fi
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "Update excluded by content selection; skipping."
          fi

          if [[ "$INCLUDE_DLC" == true ]]; then
            if [[ -z "${DLC_URL:-}" ]]; then
              echo "::error::DLC was selected, but DLC_URL is not configured."
              exit 1
            fi
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "DLC excluded by content selection; skipping."
          fi

          # Decode Base64 encryption keys.
          if [[ -z "${KEYS_BASE64:-}" ]]; then
            echo "::error::Keys_URL secret is empty."
            exit 1
          fi

          echo "Decoding Base64 encryption keys..."

          python - "$WORK/prod.keys" <<'PY'
          import base64
          import os
          import re
          import sys
          from pathlib import Path

          encoded = os.environ["KEYS_BASE64"].strip()

          encoded = re.sub(r"\s+", "", encoded)

          try:
              decoded = base64.b64decode(
                  encoded,
                  validate=True
              )
          except Exception as exc:
              raise SystemExit(
                  f"Invalid Base64 encryption keys: {exc}"
              )

          if not decoded:
              raise SystemExit("Decoded keys file is empty.")

          output = Path(sys.argv[1])
          output.write_bytes(decoded)
          output.chmod(0o600)

          print(
              f"Successfully decoded keys file: "
              f"{len(decoded):,} bytes"
          )
          PY

          test -s "$WORK/prod.keys"

          echo "All downloads and key preparation completed."

      # ================================================
      # SAVE DOWNLOAD CACHE
      # Save immediately after successful downloads,
      # even if a later build step fails.
      # ================================================

      - name: Save downloaded game files
        if: success() && steps.download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nxnative/download-cache
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.key }}

      # ================================================
      # EXTRACT RAR / VALIDATE PACKAGES
      # ================================================

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])

          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }

          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )

          def validate_package(path):
              with path.open("rb") as f:
                  magic = f.read(4)

              suffix = path.suffix.lower()

              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".xci", ".xcz") and magic != b"HEAD":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

          def add_package(source, label):
              target = game_dir / source.name

              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )

              validate_package(source)
              shutil.copy2(source, target)

              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )

          def process_download(label):
              source = work / f"{label}.download"

              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              with source.open("rb") as f:
                  signature = f.read(8)

              is_rar = any(
                  signature.startswith(magic)
                  for magic in rar_signatures
              )

              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)

                  print(f"{label}: RAR archive detected; extracting.")

                  subprocess.run(
                      [
                          "unar",
                          "-o",
                          str(extract_dir),
                          str(source),
                      ],
                      check=True,
                  )

                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in package_extensions
                  )

                  if not packages:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ packages found "
                          f"in the {label} RAR archive."
                      )

                  for package in packages:
                      add_package(package, label)

              else:
                  print(
                      f"{label}: not a RAR archive; "
                      "checking as a direct package."
                  )

                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif signature[:4] == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive "
                          "or direct NSP/XCI package."
                      )

                  target = game_dir / f"{label}{extension}"

                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )

                  shutil.copy2(source, target)
                  validate_package(target)

                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )

          process_download("game")
          process_download("update")
          process_download("dlc")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")

          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"

      # ================================================
      # DETECT BASE TITLE ID
      # NxNative performs profile lookup itself. If no
      # profile exists, it creates a survey and provisional
      # profile from the supplied NSPs before building.
      # ================================================

      - name: Detect game title ID and select shader profile
        shell: bash
        run: |
          set -euo pipefail

          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          echo "Detected base title ID: $DETECTED_ID"
          echo "NxNative will select an existing profile or generate a survey and provisional profile automatically."

          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      # ================================================
      # MATCH THE SHADER TOOL LOCK TO THIS RUNNER
      # The upstream lock records exact spirv-cross / Metal versions.
      # GitHub-hosted macOS images can ship different versions, so refresh
      # the lock and chain header after the game profile is selected.
      # This keeps the shader cache and generated iOS libraries tied to
      # the actual toolchain used for this build.
      # ================================================

      - name: Adapt shader translation lock to runner
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_ipa_from_nsp.py")
          source = path.read_text()

          old = """    PROG.stage('iOS shaders')
              if provisional:
                  PROG.set(step='chain header')
                  run([py, repo / 'dm/gfx/tools/dmsh_chain.py', '--header'], logs / 'dmsh_chain.log', env=env)   # the profile's chain version header (dmsh_build checks it)
              chain = re.search(r'#define DMSH_CHAIN "(.*)"', g.table('dmsh_chain.h').read_text()).group(1)
          """

          new = """    PROG.stage('iOS shaders')
              PROG.set(step='toolchain lock')
              run([py, repo / 'dm/gfx/tools/dmsh_chain.py', '--update-lock'], logs / 'dmsh_chain_lock.log', env=env)
              PROG.set(step='chain header')
              run([py, repo / 'dm/gfx/tools/dmsh_chain.py', '--header'], logs / 'dmsh_chain.log', env=env)
              chain = re.search(r'#define DMSH_CHAIN "(.*)"', g.table('dmsh_chain.h').read_text()).group(1)
          """

          if old not in source:
              raise SystemExit(
                  "Could not find the expected nxnative shader-chain block; "
                  "refusing to patch an unknown source version."
              )

          path.write_text(source.replace(old, new, 1))
          print("Patched shader build to refresh the tool lock and chain header.")
          PY

      # ================================================
      # BUILD UNSIGNED IPA
      # ================================================

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      # ================================================
      # UPLOAD IPA
      # ================================================

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      # ================================================
      # GENERATE BUILD DIAGNOSTICS
      # ALWAYS RUNS
      # ================================================

      - name: Generate build diagnostics
        if: always()
        env:
          DEVICE: ${{ inputs.device }}
          CONTENT_SELECTION: ${{ inputs.content }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/NxNative-Diagnostics/build-logs"

          REPORT="$RUNNER_TEMP/NxNative-Diagnostics/diagnostics.txt"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          WORK="$RUNNER_TEMP/nxnative"

          {
            echo "=========================================="
            echo "NXNATIVE BUILD DIAGNOSTICS"
            echo "=========================================="
            echo ""

            echo "BUILD INFORMATION"
            echo "-----------------"
            echo "Status: $BUILD_STATUS"
            echo "Device: $DEVICE"
            echo "Content selection: $CONTENT_SELECTION"
            echo "Profile selection: Automatic (nxnative profile lookup / survey fallback)"
            echo "Detected title ID: ${DETECTED_TITLE_ID:-Not detected}"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner architecture: $(uname -m)"
            echo "Date: $(date -u)"
            echo ""

            echo "SOURCE INFORMATION"
            echo "------------------"
            echo "Repository: $(git remote get-url origin 2>/dev/null || echo unknown)"
            echo "Commit: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "Branch: $(git branch --show-current 2>/dev/null || echo unknown)"
            echo ""

            echo "TOOL VERSIONS"
            echo "-------------"
            python --version 2>&1
            dotnet --version 2>&1 || true
            xcodebuild -version 2>&1 || true

            brew list --versions 2>/dev/null | grep -E \
              'xcodegen|zstd|spirv-cross|unar' || true

            echo ""

            echo "CACHE INFORMATION"
            echo "-----------------"
            echo "Cache key: ${{ steps.cache-key.outputs.key }}"
            echo "Cache hit: ${{ steps.download-cache.outputs.cache-hit }}"
            echo ""

            echo "DOWNLOADED FILES"
            echo "----------------"

            for f in \
              "$WORK/game.download" \
              "$WORK/update.download" \
              "$WORK/dlc.download"; do

              if [[ -s "$f" ]]; then
                echo "$(basename "$f"): $(stat -f%z "$f") bytes"
                shasum -a 256 "$f"
              else
                echo "$(basename "$f"): Missing or not configured"
              fi
            done

            if [[ -s "$WORK/prod.keys" ]]; then
              echo "prod.keys: Present (contents excluded)"
              echo "Key file size: $(stat -f%z "$WORK/prod.keys") bytes"
            else
              echo "prod.keys: Missing"
            fi

            echo ""
            echo "PREPARED PACKAGES"
            echo "-----------------"

            if [[ -d "$GAME_DIR" ]]; then
              find "$GAME_DIR" -maxdepth 1 -type f \
                -exec sh -c '
                  for f do
                    echo "$(basename "$f"): $(stat -f%z "$f") bytes"
                    shasum -a 256 "$f"
                  done
                ' sh {} +
            else
              echo "GameFiles directory was not created."
            fi

            echo ""
            echo "IPA OUTPUT"
            echo "----------"

            if [[ -s "$RUNNER_TEMP/NxNative.ipa" ]]; then
              ls -lh "$RUNNER_TEMP/NxNative.ipa"
              shasum -a 256 "$RUNNER_TEMP/NxNative.ipa"
            else
              echo "IPA was not created."
            fi

            echo ""
            echo "DISK SPACE"
            echo "----------"
            df -h "$RUNNER_TEMP" 2>&1 || true

            echo ""
            echo "DIAGNOSTICS COMPLETE"
            echo "=========================================="

          } > "$REPORT" 2>&1

          # Collect nxnative-generated build logs and surveys.
          if [[ -d "$GAME_DIR" ]]; then

            find "$GAME_DIR" -type d \
              \( -name logs -o -name '*_survey' -o -name profile \) \
              -print0 |
            while IFS= read -r -d '' dir; do

              destination="$RUNNER_TEMP/NxNative-Diagnostics/build-logs/$(basename "$(dirname "$dir")")-$(basename "$dir")"

              mkdir -p "$destination"

              cp -R "$dir/." "$destination/" 2>/dev/null || true

            done
          fi

          echo "Diagnostics report generated."
          cat "$REPORT"

      # ================================================
      # ALWAYS UPLOAD DIAGNOSTICS
      # ================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Diagnostics
          path: ${{ runner.temp }}/NxNative-Diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # ================================================
      # CLEANUP
      # ================================================

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
