
name: NxNative - Generic IPA Builder

'on':
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      content:
        description: "Choose which game content to include"
        required: true
        type: choice
        default: "Base game + update + DLC"
        options:
          - "Base game only"
          - "Base game + update (no DLC)"
          - "Base game + DLC (no update)"
          - "Base game + update + DLC"

permissions:
  contents: read

jobs:
  build:
    # Both NxNative paths require an ARM64 macOS host; the BC fallback
    # changes texture handling, not the host CPU architecture.
    # Use the standard Apple Silicon macOS runner for public-repository builds.
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # ================================================
      # CHECKOUT
      # ================================================

      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      # Recognize unframed pointer thunks followed by zero trap padding.
      # Upstream fix for jump-table assertions on indirect tail calls (Moving Out 2 fix).
      - name: Backport padded tail-call recognition (BC fallback)
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("dm/tools/patch_nso.py")
          source = path.read_text()

          marker = "def tail_call(insl, j):"
          if source.count(marker) != 1:
              raise SystemExit(
                  "Could not find exactly one tail_call function; "
                  "refusing to patch an unknown BC-fallback rewriter."
              )

          helper = '''def tail_call_padded(insl, j):
              """An unframed, straight-line pointer thunk ending in br x18 and zero trap padding."""
              if j + 1 >= len(insl) or any(p.mnemonic != 'udf' or p.op_str != '#0' for p in insl[j + 1:]): return False
              if any(b.address != a.address + 4 for a, b in zip(insl, insl[1:])): return False
              for p in insl[:j]:
                  if p.mnemonic not in ('mov', 'ldr', 'ldrh', 'ldp', 'add', 'str', 'stp'): return False
                  if {p.reg_name(r) for r in p.regs_access()[1]} & {'sp', 'wsp', 'fp', 'lr', 'x29', 'w29', 'x30', 'w30'}: return False
              for p in reversed(insl[:j]):
                  if not {'x18', 'w18'} & {p.reg_name(r) for r in p.regs_access()[1]}: continue
                  return p.mnemonic in ('ldr', 'ldp') and bool(re.fullmatch(r'x18, (x\\d+, )?\\[(x\\d+|sp)(, #(0x[0-9a-f]+|\\d+))?\\]', p.op_str))
              return False

          '''
          source = source.replace(marker, helper + marker, 1)

          old = "    if j + 1 != len(insl): return False\n"
          new = "    if j + 1 == len(insl):\n        pass\n    elif tail_call_padded(insl, j):\n        return True\n    else:\n        return False\n"
          if source.count(old) != 1:
              raise SystemExit(
                  "Could not find the expected terminal-tail check; "
                  "refusing to patch an unknown tail_call implementation."
              )
          source = source.replace(old, new, 1)

          path.write_text(source)
          compile(source, str(path), "exec")
          print("Installed guarded recognition for padded, unframed x18 pointer tail calls.")
          PY

      # Treat code before the first unwind entry as one function, not one-instruction functions.
      # FINAL FANTASY RESONANCE has no FDE until main+0x6a75d4; its byte jump table at
      # main+0x219234 needs the preceding adr x18 to be visible to the br x18 recognizer.
      - name: Backport pre-FDE function boundary recognition (BC fallback)
        if: inputs.device == 'iPhone 15 or older (BC fallback)' && env.DETECTED_TITLE_ID != '0100606026F12000'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("dm/tools/patch_nso.py")
          source = path.read_text()

          old = """def func_of(a):
              i = bisect.bisect_right(starts, a) - 1
              return (starts[i], starts[i + 1] if i + 1 < len(starts) else TEXT_END) if i >= 0 else (a, a + 4)
          """

          new = '''def func_of(a):
              """Include code before the first FDE in one function, starting after the preceding data block."""
              i = bisect.bisect_right(starts, a) - 1
              if i >= 0:
                  return (starts[i], starts[i + 1] if i + 1 < len(starts) else TEXT_END)
              return (max((e for s, e in DATA_BLOCKS if e <= a), default=0), starts[0]) if starts else (a, a + 4)
          '''

          if source.count(old) != 1:
              raise SystemExit(
                  "Could not find the expected original func_of implementation; "
                  "refusing to patch an unknown BC-fallback rewriter."
              )

          source = source.replace(old, new, 1)
          path.write_text(source)
          compile(source, str(path), "exec")
          print("Installed pre-FDE function boundary recognition for BC fallback.")
          PY

      # Split very large functions without unwind entries before detailed disassembly.
      # The first-FDE region in FINAL FANTASY RESONANCE is ~6.6 MB; disassembling it
      # as one function exhausts memory. Backport upstream's branch-safe piece splitter.
      - name: Split oversized rewriter functions (BC fallback)
        if: inputs.device == 'iPhone 15 or older (BC fallback)' && env.DETECTED_TITLE_ID != '0100606026F12000'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("dm/tools/patch_nso.py")
          source = path.read_text()

          old = "funcs = sorted({func_of(a) for a, (k, _) in kinds.items() if k == 'x18'})\n"
          if source.count(old) != 1:
              raise SystemExit(
                  "Could not find the expected function-disassembly loop; "
                  "refusing to patch an unknown BC-fallback rewriter."
              )

          splitter = '''# Avoid disassembling very large functions as one Capstone instruction list.
          # Branch-safe cuts preserve local jump-table/window context.
          BIG_FN, PIECE, PIECE_B = 0x40000, 0x40000, 0x10000
          def pieces(fa, fb):
              """Return branch-safe pieces covering [fa, fb), plus far b/bl edges."""
              from array import array
              n = (fb - fa) // 4
              w = memoryview(bytes(IMG[fa:fa + 4 * n])).cast('I')
              cross = array('i', bytes(4 * (n + 2))); far = []
              for i in range(n):
                  x = w[i]; t = x >> 24
                  if t == 0x54 and not x & 0x10 or t & 0x7E == 0x34:
                      d = (x >> 5) & 0x7FFFF; d -= (d & 0x40000) << 1
                  elif t & 0x7E == 0x36:
                      d = (x >> 5) & 0x3FFF; d -= (d & 0x2000) << 1
                  elif t & 0x7C == 0x14:
                      d = x & 0x3FFFFFF; d -= (d & 0x2000000) << 1
                      if t & 0x80 or 4 * abs(d) > PIECE_B:
                          far.append((fa + 4 * i, fa + 4 * (i + d))); continue
                  else:
                      continue
                  lo, hi = max(min(i, i + d), -1), min(max(i, i + d), n)
                  cross[lo + 1] += 1; cross[hi + 1] -= 1
              cand, c = [], 0
              for k in range(n):
                  c += cross[k]
                  x = w[k - 1] if k else 0
                  if k and not c and (x & 0xFFFFFC1F in (0xD65F0000, 0xD61F0000) or x >> 26 == 0x05):
                      cand.append(k)
              cuts, start = [], 0
              while start + PIECE // 4 < n:
                  j = bisect.bisect_right(cand, start + PIECE // 4) - 1
                  if j < 0 or cand[j] <= start:
                      j = bisect.bisect_right(cand, start + PIECE // 4)
                  if j >= len(cand):
                      break
                  start = cand[j]; cuts.append(start)
              bounds = [0] + cuts + [n]
              return [(fa + 4 * p, fa + 4 * q) for p, q in zip(bounds, bounds[1:])], far

          funcs = sorted({func_of(a) for a, (k, _) in kinds.items() if k == 'x18'})
          if any(fb - fa > BIG_FN for fa, fb in funcs):
              sites18 = sorted(a for a, (k, _) in kinds.items() if k == 'x18')
              split = []
              for fa, fb in funcs:
                  if fb - fa <= BIG_FN:
                      split.append((fa, fb)); continue
                  function_pieces, far_edges = pieces(fa, fb)
                  split += [
                      (p, q) for p, q in function_pieces
                      if bisect.bisect_left(sites18, p) < bisect.bisect_left(sites18, q)
                  ]
                  print(
                      f"Split large function {fa:#x}..{fb:#x} "
                      f"({(fb-fa)/2**20:.2f} MB) into {len(function_pieces)} branch-safe pieces."
                  )
              funcs = split
          '''

          source = source.replace(old, splitter + "\n", 1)
          path.write_text(source)
          compile(source, str(path), "exec")
          print("Installed upstream branch-safe splitting for oversized rewriter functions.")
          PY

      # Record the actual host GPU exposed to the BC-fallback build.
      - name: Inspect Mac runner Metal hardware (BC fallback)
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Runner identity ==="
          uname -a
          sw_vers
          echo "=== Display / GPU hardware ==="
          system_profiler SPDisplaysDataType
          echo "=== Xcode ==="
          xcodebuild -version

      # ================================================
      # ENVIRONMENT
      # ================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install xcodegen zstd spirv-cross unar

          python -m pip install --upgrade pip

          python -m pip install \
            lz4 'capstone>=5,<6' fonttools backports.zstd

      # ================================================
      # DOWNLOAD CACHE KEY
      # ================================================

      - name: Prepare download cache
        id: cache-key
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import os

          urls = [
              os.environ.get("GAME_URL", "").strip(),
              os.environ.get("UPDATE_URL", "").strip(),
              os.environ.get("DLC_URL", "").strip(),
          ]

          if not urls[0]:
              raise SystemExit("Game_URL secret is empty.")

          cache_key = hashlib.sha256(
              "|".join(urls).encode()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"key=nxnative-downloads-{cache_key}\n")

          print("Download cache key prepared.")
          PY

          mkdir -p "$RUNNER_TEMP/nxnative/download-cache"

      - name: Restore downloaded game files
        id: download-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nxnative/download-cache
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.key }}

      # ================================================
      # DOWNLOAD GAME / UPDATE / DLC
      # DECODE BASE64 KEYS
      # ================================================

      - name: Download game files and decode keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_BASE64: ${{ secrets.Keys_URL }}
          CONTENT_SELECTION: ${{ inputs.content }}
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nxnative"
          CACHE="$WORK/download-cache"

          mkdir -p "$WORK" "$CACHE"

          download_file() {
            local url="$1"
            local output="$2"
            local filename
            local cached
            local temporary

            filename="$(basename "$output")"
            cached="$CACHE/$filename"
            temporary="$output.part"

            if [[ -z "${url:-}" ]]; then
              echo "::error::Download URL is empty."
              exit 1
            fi

            # Reuse cached downloads.
            if [[ -s "$cached" ]]; then
              echo "========================================"
              echo "CACHE HIT: $filename"
              echo "Reusing cached download."
              echo "========================================"

              cp "$cached" "$output"
              file "$output"
              return
            fi

            echo "========================================"
            echo "CACHE MISS: $filename"
            echo "Starting direct download..."
            echo "========================================"

            # Direct HTTP/HTTPS download with percentage progress.
            curl \
              --fail \
              --location \
              --show-error \
              --progress-bar \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --output "$temporary" \
              "$url"

            if [[ ! -s "$temporary" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            mv "$temporary" "$output"

            echo "Download completed:"
            ls -lh "$output"
            file "$output"

            # Cache successful downloads.
            cp "$output" "$cached"

            echo "Saved $filename to download cache."
          }

          # Base game is required.
          download_file "$GAME_URL" "$WORK/game.download"

          # Include only the content selected at workflow dispatch.
          # The cache key still uses all three URLs, so existing cached
          # game/update/DLC downloads remain available across these choices.
          case "${CONTENT_SELECTION:-}" in
            "Base game only")
              INCLUDE_UPDATE=false
              INCLUDE_DLC=false
              ;;
            "Base game + update (no DLC)")
              INCLUDE_UPDATE=true
              INCLUDE_DLC=false
              ;;
            "Base game + DLC (no update)")
              INCLUDE_UPDATE=false
              INCLUDE_DLC=true
              ;;
            "Base game + update + DLC")
              INCLUDE_UPDATE=true
              INCLUDE_DLC=true
              ;;
            *)
              echo "::error::Unknown content selection: ${CONTENT_SELECTION:-unset}"
              exit 1
              ;;
          esac

          if [[ "$INCLUDE_UPDATE" == true ]]; then
            if [[ -z "${UPDATE_URL:-}" ]]; then
              echo "::error::Update was selected, but UPDATE_URL is not configured."
              exit 1
            fi
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "Update excluded by content selection; skipping."
          fi

          if [[ "$INCLUDE_DLC" == true ]]; then
            if [[ -z "${DLC_URL:-}" ]]; then
              echo "::error::DLC was selected, but DLC_URL is not configured."
              exit 1
            fi
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "DLC excluded by content selection; skipping."
          fi

          # Decode Base64 encryption keys.
          if [[ -z "${KEYS_BASE64:-}" ]]; then
            echo "::error::Keys_URL secret is empty."
            exit 1
          fi

          echo "Decoding Base64 encryption keys..."

          python - "$WORK/prod.keys" <<'PY'
          import base64
          import os
          import re
          import sys
          from pathlib import Path

          encoded = os.environ["KEYS_BASE64"].strip()

          encoded = re.sub(r"\s+", "", encoded)

          try:
              decoded = base64.b64decode(
                  encoded,
                  validate=True
              )
          except Exception as exc:
              raise SystemExit(
                  f"Invalid Base64 encryption keys: {exc}"
              )

          if not decoded:
              raise SystemExit("Decoded keys file is empty.")

          output = Path(sys.argv[1])
          output.write_bytes(decoded)
          output.chmod(0o600)

          print(
              f"Successfully decoded keys file: "
              f"{len(decoded):,} bytes"
          )
          PY

          test -s "$WORK/prod.keys"

          echo "All downloads and key preparation completed."

      # ================================================
      # SAVE DOWNLOAD CACHE
      # Save immediately after successful downloads,
      # even if a later build step fails.
      # ================================================

      - name: Save downloaded game files
        if: success() && steps.download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nxnative/download-cache
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.key }}

      # ================================================
      # EXTRACT RAR / VALIDATE PACKAGES
      # ================================================

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])

          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }

          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )

          def validate_package(path):
              with path.open("rb") as f:
                  magic = f.read(4)

              suffix = path.suffix.lower()

              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".xci", ".xcz") and magic != b"HEAD":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

          def add_package(source, label):
              target = game_dir / source.name

              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )

              validate_package(source)
              shutil.copy2(source, target)

              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )

          def process_download(label):
              source = work / f"{label}.download"

              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              with source.open("rb") as f:
                  signature = f.read(8)

              is_rar = any(
                  signature.startswith(magic)
                  for magic in rar_signatures
              )

              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)

                  print(f"{label}: RAR archive detected; extracting.")

                  subprocess.run(
                      [
                          "unar",
                          "-o",
                          str(extract_dir),
                          str(source),
                      ],
                      check=True,
                  )

                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in package_extensions
                  )

                  if not packages:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ packages found "
                          f"in the {label} RAR archive."
                      )

                  for package in packages:
                      add_package(package, label)

              else:
                  print(
                      f"{label}: not a RAR archive; "
                      "checking as a direct package."
                  )

                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif signature[:4] == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive "
                          "or direct NSP/XCI package."
                      )

                  target = game_dir / f"{label}{extension}"

                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )

                  shutil.copy2(source, target)
                  validate_package(target)

                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )

          process_download("game")
          process_download("update")
          process_download("dlc")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")

          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"

      # ================================================
      # DETECT BASE TITLE ID
      # NxNative performs profile lookup itself. If no
      # profile exists, it creates a survey and provisional
      # profile from the supplied NSPs before building.
      # ================================================

      - name: Detect game title ID and select shader profile
        shell: bash
        run: |
          set -euo pipefail

          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          echo "Detected base title ID: $DETECTED_ID"
          echo "NxNative will select an existing profile or generate a survey and provisional profile automatically."

          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      # Backport the upstream game profile and engine support while preserving BC textures.
      - name: Backport FINAL FANTASY RESONANCE support onto BC fallback
        if: inputs.device == 'iPhone 15 or older (BC fallback)' && env.DETECTED_TITLE_ID == '0100606026F12000'
        shell: bash
        run: |
          set -euo pipefail
          MERGE_BASE="8b4db4153e8845717302b32e3ee9cdc6984669be"
          GAME_SUPPORT="2000f9274aad0c7739160d5fd7ec7c16b88d188c"
          PATCH="$RUNNER_TEMP/final-fantasy-resonance-upstream.patch"
          git fetch --no-tags https://github.com/seedds/nxnative.git "$MERGE_BASE"
          git fetch --no-tags https://github.com/seedds/nxnative.git "$GAME_SUPPORT"
          git diff --binary "$MERGE_BASE" "$GAME_SUPPORT" > "$PATCH"
          git apply --3way --index "$PATCH"
          test -f dm/games/0100606026F12000/game.tsv
          test -f dm/games/0100606026F12000/shader_facts_manual.tsv
          grep -q '^title_id[[:space:]]0100606026F12000$' dm/games/0100606026F12000/game.tsv
          grep -q '^tex_dyn_slots[[:space:]]on$' dm/games/0100606026F12000/game.tsv
          grep -q 'io_shader_tocs' dm/gfx/tools/uepak.py
          grep -q 'OodleHost' dm/gfx/tools/uepak.py
          grep -q 'io_shader_tocs' scripts/build_ipa_from_nsp.py
          python -m py_compile dm/gfx/tools/uepak.py dm/tools/patch_nso.py scripts/build_ipa_from_nsp.py
          git diff --cached --check
          echo "Applied FINAL FANTASY RESONANCE profile, IoStore/Oodle, UE 5.6.1 allocator and shader fixes."

      # Backport upstream's verified SDK address-space patches into the older BC-texture fork.
      # The matcher fingerprints complete SDK functions and asserts original bytes before applying cuts.
      - name: Add verified SDK memory patches (BC fallback)
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="777a5f6c618a38cd2d7f795f465466fb56920534"
          RAW="https://raw.githubusercontent.com/seedds/nxnative/$UPSTREAM_COMMIT/dm/tools"

          curl -fsSL "$RAW/nso_code.py" -o dm/tools/nso_code.py
          curl -fsSL "$RAW/nso_match.py" -o dm/tools/nso_match.py
          curl -fsSL "$RAW/sdk_patches.py" -o dm/tools/sdk_patches.py

          python - <<'PY'
          from pathlib import Path

          path = Path("dm/tools/patch_nso.py")
          source = path.read_text()

          old = """BUILD_ID = d[0x40:0x50].hex()
          cuts = list(CUTS.get(BUILD_ID, []))
          """

          new = """BUILD_ID = d[0x40:0x50].hex()
          cuts = list(CUTS.get(BUILD_ID, []))

          # Apply upstream's SDK-wide address-space workarounds only to SDK modules.
          # resolve() matches complete function fingerprints and verifies every
          # original instruction before the existing byte-checked cut loop runs.
          if NAME == 'sdk':
              import sdk_patches
              from nso_match import resolve
              cuts += resolve(IMG, TEXT_END, sdk_patches.MATCH_CUTS.get('sdk', []), red=False)
          """

          if source.count(old) != 1:
              raise SystemExit(
                  "Could not find the expected SDK cut block in patch_nso.py; "
                  "refusing to patch an unknown BC-fallback source version."
              )

          path.write_text(source.replace(old, new, 1))
          print("Installed verified upstream SDK function-matching patches for BC fallback.")
          PY


      # Print the Metal residency-set NSError and device/OS capabilities on BC-fallback builds.
      # This is diagnostic-only: it preserves the upstream failure behavior and does not bypass it.
      - name: Add Metal residency-set diagnostics (BC fallback)
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("dm/gfx/nvn/nvn_mtl.m")
          source = path.read_text()

          old = '''    g_q = [g_dev newCommandQueue];
              MTLResidencySetDescriptor *rd = [MTLResidencySetDescriptor new];
              rd.initialCapacity = 4096;
              NSError *re = nil;
              g_res = [g_dev newResidencySetWithDescriptor:rd error:&re];
              if (!g_res) MDIE("failed to create the MTLResidencySet");
          '''

          new = '''    MLOG("Metal device: %s; registryID=%llu; unifiedMemory=%d; maxBufferLength=%llu; recommendedMaxWorkingSetSize=%llu; OS=%s",
              g_dev.name.UTF8String,
              (unsigned long long)g_dev.registryID,
              g_dev.hasUnifiedMemory,
              (unsigned long long)g_dev.maxBufferLength,
              (unsigned long long)g_dev.recommendedMaxWorkingSetSize,
              NSProcessInfo.processInfo.operatingSystemVersionString.UTF8String);
              g_q = [g_dev newCommandQueue];
              MTLResidencySetDescriptor *rd = [MTLResidencySetDescriptor new];
              rd.initialCapacity = 4096;
              NSError *re = nil;
              g_res = [g_dev newResidencySetWithDescriptor:rd error:&re];
              if (!g_res) {
                  MLOG("FATAL failed to create the MTLResidencySet");
                  if (re) {
                      MLOG("Metal residency-set NSError: domain=%s code=%ld description=%s userInfo=%s",
                           re.domain.UTF8String, (long)re.code,
                           re.localizedDescription.UTF8String,
                           re.userInfo.description.UTF8String);
                  } else {
                      MLOG("Metal residency-set NSError was nil");
                  }
                  abort();
              }
          '''
          if old not in source:
              raise SystemExit(
                  "Could not find the expected Metal residency-set initialization block; "
                  "refusing to patch an unknown NxNative source version."
              )

          path.write_text(source.replace(old, new, 1))
          print("Added Metal device/OS and residency-set NSError diagnostics.")
          PY


      # ================================================
      # MATCH THE SHADER TOOL LOCK TO THIS RUNNER
      # The upstream lock records exact spirv-cross / Metal versions.
      # GitHub-hosted macOS images can ship different versions, so refresh
      # the lock and chain header after the game profile is selected.
      # This keeps the shader cache and generated iOS libraries tied to
      # the actual toolchain used for this build.
      # ================================================

      - name: Adapt shader translation lock to runner
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_ipa_from_nsp.py")
          source = path.read_text()

          old = """    PROG.stage('iOS shaders')
              if provisional:
                  PROG.set(step='chain header')
                  run([py, repo / 'dm/gfx/tools/dmsh_chain.py', '--header'], logs / 'dmsh_chain.log', env=env)   # the profile's chain version header (dmsh_build checks it)
              chain = re.search(r'#define DMSH_CHAIN "(.*)"', g.table('dmsh_chain.h').read_text()).group(1)
          """

          new = """    PROG.stage('iOS shaders')
              PROG.set(step='toolchain lock')
              run([py, repo / 'dm/gfx/tools/dmsh_chain.py', '--update-lock'], logs / 'dmsh_chain_lock.log', env=env)
              PROG.set(step='chain header')
              run([py, repo / 'dm/gfx/tools/dmsh_chain.py', '--header'], logs / 'dmsh_chain.log', env=env)
              chain = re.search(r'#define DMSH_CHAIN "(.*)"', g.table('dmsh_chain.h').read_text()).group(1)
          """

          if old not in source:
              raise SystemExit(
                  "Could not find the expected nxnative shader-chain block; "
                  "refusing to patch an unknown source version."
              )

          path.write_text(source.replace(old, new, 1))
          print("Patched shader build to refresh the tool lock and chain header.")
          PY

      # ================================================
      # HANDLE UNITY COMPUTE KERNELS WITHOUT uniqueVariants
      # Some Unity 2021.3 serialized ComputeShader kernels do not expose
      # this field. Skip only those kernels and report them, rather than
      # aborting the entire shader scan. Runtime capture can still collect
      # shaders that the game actually uses.
      # ================================================

      - name: Handle Unity compute kernels without uniqueVariants
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("dm/gfx/tools/shader_split.py")
          lines = path.read_text().splitlines(keepends=True)

          target = "for i, u in enumerate(k['uniqueVariants']):"
          matches = [i for i, line in enumerate(lines) if line.strip() == target]
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one uniqueVariants loop, found {len(matches)}; "
                  "refusing to patch an unknown shader_split.py version."
              )

          i = matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i] = (
              indent + "unique_variants = k.get('uniqueVariants')\n"
              + indent + "if unique_variants is None:\n"
              + indent + "    print(f'[YELLOW] {base}#{o.get(\"m_Name\", \"?\")}#{k.get(\"name\", \"?\")}: ComputeShader kernel has no uniqueVariants field; skipping this kernel', flush=True)\n"
              + indent + "    continue\n"
              + indent + "for i, u in enumerate(unique_variants):\n"
          )

          path.write_text("".join(lines))
          print("Patched Unity compute shader scanning to skip kernels without uniqueVariants.")
          PY

      # ================================================
      # BUILD UNSIGNED IPA
      # ================================================

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      # ================================================
      # UPLOAD IPA
      # ================================================

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      # ================================================
      # GENERATE BUILD DIAGNOSTICS
      # ALWAYS RUNS
      # ================================================

      - name: Generate build diagnostics
        if: always()
        env:
          DEVICE: ${{ inputs.device }}
          CONTENT_SELECTION: ${{ inputs.content }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/NxNative-Diagnostics/build-logs"

          REPORT="$RUNNER_TEMP/NxNative-Diagnostics/diagnostics.txt"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          WORK="$RUNNER_TEMP/nxnative"

          {
            echo "=========================================="
            echo "NXNATIVE BUILD DIAGNOSTICS"
            echo "=========================================="
            echo ""

            echo "BUILD INFORMATION"
            echo "-----------------"
            echo "Status: $BUILD_STATUS"
            echo "Device: $DEVICE"
            echo "Content selection: $CONTENT_SELECTION"
            echo "Profile selection: Automatic (nxnative profile lookup / survey fallback)"
            echo "Detected title ID: ${DETECTED_TITLE_ID:-Not detected}"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner architecture: $(uname -m)"
            echo "Date: $(date -u)"
            echo ""

            echo "SOURCE INFORMATION"
            echo "------------------"
            echo "Repository: $(git remote get-url origin 2>/dev/null || echo unknown)"
            echo "Commit: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "Branch: $(git branch --show-current 2>/dev/null || echo unknown)"
            echo ""

            echo "TOOL VERSIONS"
            echo "-------------"
            python --version 2>&1
            dotnet --version 2>&1 || true
            xcodebuild -version 2>&1 || true

            brew list --versions 2>/dev/null | grep -E \
              'xcodegen|zstd|spirv-cross|unar' || true

            echo ""

            echo "CACHE INFORMATION"
            echo "-----------------"
            echo "Cache key: ${{ steps.cache-key.outputs.key }}"
            echo "Cache hit: ${{ steps.download-cache.outputs.cache-hit }}"
            echo ""

            echo "DOWNLOADED FILES"
            echo "----------------"

            for f in \
              "$WORK/game.download" \
              "$WORK/update.download" \
              "$WORK/dlc.download"; do

              if [[ -s "$f" ]]; then
                echo "$(basename "$f"): $(stat -f%z "$f") bytes"
                shasum -a 256 "$f"
              else
                echo "$(basename "$f"): Missing or not configured"
              fi
            done

            if [[ -s "$WORK/prod.keys" ]]; then
              echo "prod.keys: Present (contents excluded)"
              echo "Key file size: $(stat -f%z "$WORK/prod.keys") bytes"
            else
              echo "prod.keys: Missing"
            fi

            echo ""
            echo "PREPARED PACKAGES"
            echo "-----------------"

            if [[ -d "$GAME_DIR" ]]; then
              find "$GAME_DIR" -maxdepth 1 -type f \
                -exec sh -c '
                  for f do
                    echo "$(basename "$f"): $(stat -f%z "$f") bytes"
                    shasum -a 256 "$f"
                  done
                ' sh {} +
            else
              echo "GameFiles directory was not created."
            fi

            echo ""
            echo "IPA OUTPUT"
            echo "----------"

            if [[ -s "$RUNNER_TEMP/NxNative.ipa" ]]; then
              ls -lh "$RUNNER_TEMP/NxNative.ipa"
              shasum -a 256 "$RUNNER_TEMP/NxNative.ipa"
            else
              echo "IPA was not created."
            fi

            echo ""
            echo "DISK SPACE"
            echo "----------"
            df -h "$RUNNER_TEMP" 2>&1 || true

            echo ""
            echo "DIAGNOSTICS COMPLETE"
            echo "=========================================="

          } > "$REPORT" 2>&1

          # Collect nxnative-generated build logs and surveys.
          if [[ -d "$GAME_DIR" ]]; then

            find "$GAME_DIR" -type d \
              \( -name logs -o -name '*_survey' -o -name profile \) \
              -print0 |
            while IFS= read -r -d '' dir; do

              destination="$RUNNER_TEMP/NxNative-Diagnostics/build-logs/$(basename "$(dirname "$dir")")-$(basename "$dir")"

              mkdir -p "$destination"

              cp -R "$dir/." "$destination/" 2>/dev/null || true

            done
          fi

          echo "Diagnostics report generated."
          cat "$REPORT"

      # ================================================
      # ALWAYS UPLOAD DIAGNOSTICS
      # ================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Diagnostics
          path: ${{ runner.temp }}/NxNative-Diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # ================================================
      # CLEANUP
      # ================================================

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
